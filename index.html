    t.value = ''; $('#fileMenu').open = false; return;
  }
  if (!f) return;
  const v = t.type === 'checkbox' ? t.checked : t.value;
  switch (f){
    case 'ss': state.ss = +v; if (state.se < state.ss) state.se = state.ss; break;
    case 'se': state.se = +v; if (state.ss > state.se) state.ss = state.se; break;
    case 'defMax': state.defMax = clamp(+v || 1, 1, 99); break;
    case 'comp': state.comp = v; break;
    case 'wk': { const w = +t.dataset.w, n = clamp(+v || 0, 0, 99); if (n === state.defMax) delete state.weekMax[w]; else state.weekMax[w] = n; break; }
    case 'roleName': findR(t.dataset.id).name = v.trim() || 'Rooli'; break;
    case 'roleMax': findR(t.dataset.id).max = clamp(+v || 0, 0, 99); break;
    case 'pName': {
      // Ei uudelleenpiirtoa: muuten samaan aikaan klikattu listan kortti katoaisi alta
      findP(t.dataset.id).name = v.trim(); save();
      const nb = $(`.pcard[data-id="${t.dataset.id}"] b`); if (nb) nb.textContent = v.trim() || 'Nimetön';
      return;
    }
    case 'minMain': state.minMain = +v; state.people.forEach(fixShapes); break;
    case 'pNote': {
      // Ei uudelleenpiirtoa, sama syy kuin nimellä
      findP(t.dataset.id).note = v.trim(); save(); return;
    }
    case 'cf': state.cf = +v; state.ct = state.cf ? Math.max(state.ct || state.cf, state.cf) : 0; state.people.forEach(fixShapes); break;
    case 'ct': state.ct = Math.max(+v, state.cf); state.people.forEach(fixShapes); break;
    case 'unit': state.unit = v.trim(); save(); return;
    case 'deadline': state.deadline = v; save(); return;
    case 'swapWith': {
      // Kahden henkilön lomat vaihdetaan keskenään ja molemmat lukitaan
      const p = findP(resSel), q = findP(v), A = state.result.A;
      if (!p || !q) return;
      const pa = A[p.id].s, qa = A[q.id].s;
      applyManual(p, qa); applyManual(q, pa);
      toast(`${p.name} ja ${q.name} vaihtoivat lomat`); break;
    }
  }
  save(); render();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'pSearch') return;
  pSearch = e.target.value; const q = norm(pSearch);
  $$('.pcard').forEach(c => c.hidden = !!q && !c.dataset.name.includes(q));
});
document.addEventListener('click', async e => {
  // Avoimet valikot sulkeutuvat, kun klikataan muualle tai valitaan toiminto
  const menu = e.target.closest('details.menu');
  $$('details.menu[open]').forEach(d => { if (d !== menu || e.target.closest('.menu-pop button')) d.open = false; });
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (b.tagName === 'A') e.preventDefault();
  switch (act){
    case 'tab': showTab(b.dataset.tab); return;
    case 'theme': theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, theme); } catch {} applyTheme(); return;
    case 'startOwn': heroHidden = true; showTab('settings'); return;
    case 'bump': {
      const inp = b.parentElement.querySelector('input');
      inp.value = (+inp.value || 0) + +b.dataset.d;
      inp.dispatchEvent(new Event('change', {bubbles:true})); return;
    }
    case 'demo':
      if (state.people.length && !(await ask('Korvataanko nykyiset tiedot esimerkkiaineistolla?', 'Korvaa', true))) return;
      state = demoState(); save(); showTab('people'); toast('Esimerkkiaineisto ladattu: hoivayksikkö, 16 henkilöä'); return;
    case 'backup': download(`lomajako-${state.year}-varmuuskopio.json`, JSON.stringify(state, null, 1), 'application/json'); return;
    case 'reset': if (await ask('Poistetaanko kaikki tiedot tästä selaimesta? Tätä ei voi perua. Ota tarvittaessa ensin varmuuskopio.', 'Poista kaikki', true)){ state = defaultState(); save(); showTab('settings'); } return;
    case 'addRole': state.roles.push({id:uid('r'), name:'Uusi rooli', max:state.defMax}); break;
    case 'delRole': state.roles = state.roles.filter(r => r.id !== b.dataset.id); state.people.forEach(p => { if (p.role === b.dataset.id) p.role = ''; }); break;
    case 'addPerson': addPerson(); break;
    case 'delPerson': {
      const i = state.people.findIndex(p => p.id === b.dataset.id);
      if (!(await ask(`Poistetaanko ${state.people[i].name || 'nimetön henkilö'}?`, 'Poista', true))) return;
      state.people.splice(i, 1); selId = state.people[Math.min(i, state.people.length - 1)]?.id || null; break;
    }
    case 'selP': selId = b.dataset.id; renderPeople(); return;
    case 'navP': {
      const i = state.people.findIndex(p => p.id === selId) + +b.dataset.d;
      if (i >= state.people.length) addPerson(); else if (i >= 0) selId = state.people[i].id;
      break;
    }
    case 'setRole': findP(selId).role = b.dataset.v; break;
    case 'setLen': { const p = findP(selId); p.len = +b.dataset.v; fixShapes(p); break; }
    case 'setWishSplit': {
      // Muodon vaihtuessa alkuviikot säilyvät; yhtenäiseen jää vain pidemmän osan alku
      const p = findP(selId), k = +b.dataset.k, sp = +b.dataset.v, cur = wishOf(p, k);
      p.wishes[k] = {sp, s: segLens(p, sp).map((_, i) => cur.s[i] ?? null)}; fixShapes(p); break;
    }
    case 'wishCell': {
      const p = findP(selId), k = +b.dataset.k, i = +b.dataset.i, w = +b.dataset.w, cur = wishOf(p, k);
      const L = segLens(p, cur.sp), len = L[i], s = L.map((_, j) => cur.s[j] ?? null);
      s[i] = s[i] != null && w >= s[i] && w < s[i] + len ? null : clamp(w, state.ss, state.se - len + 1);
      if (s[i] != null) for (let x = s[i]; x < s[i] + len; x++) if (isClosed(x)){ toast(`Jakso osuisi sulkuviikoille (${closedLabel()})`); return; }
      p.wishes[k] = s.every(x => x == null) && !cur.sp ? null : {sp: L.length === 2 ? L[0] : 0, s}; break;
    }
    case 'toggleImport': showImport = !showImport; renderPeople(); return;
    case 'doImport': importPeople($('#impText').value); showImport = false; break;
    case 'closeReport': importReport = null; renderPeople(); return;
    case 'tplCsv': download(`lomatoiveet-${state.year}.csv`, templateCSV(), 'text/csv'); return;
    case 'printRules': printRules(); return;
    case 'printWall': printWall(); return;
    case 'printSlips': printSlips(); return;
    case 'lockWish': { const p = findP(selId), f = wl(p)[0]; if (f) p.fixed = f.map(x => [...x]); break; }
    case 'unlockP': delete findP(selId).fixed; break;
    case 'resSel': resSel = b.dataset.id || null; renderResult(); if (resSel) $('.personpanel')?.scrollIntoView({behavior:'smooth', block:'start'}); return;
    case 'movePlan': { const p = findP(resSel); applyManual(p, wl(p)[+b.dataset.k]); break; }
    case 'moveTo': {
      const p = findP(resSel), a = state.result.A[p.id], w = +b.dataset.w;
      let plan;
      if (!freeLen(p)) return;
      if (!a.s?.length) plan = [[clamp(w, state.ss, state.se - freeLen(p) + 1), freeLen(p)]];
      else {
        // Siirretään klikkausta lähempi osa, muoto säilyy
        plan = a.s.map(x => [...x]);
        const i = plan.length < 2 ? 0 : Math.abs(w - (plan[0][0] + plan[0][1] / 2)) <= Math.abs(w - (plan[1][0] + plan[1][1] / 2)) ? 0 : 1;
        plan[i][0] = clamp(w, state.ss, state.se - plan[i][1] + 1);
        if (!validSegs(plan)){ toast('Loman osat menisivät päällekkäin'); return; }
      }
      applyManual(p, plan); break;
    }
    case 'lockRes': { const p = findP(resSel); applyManual(p, state.result.A[p.id].s); break; }
    // Lukitus koskee vain seuraavaa laskentaa; nykyinen tulos (ja sen perustelu) säilyy
    case 'unlockRes': { delete findP(resSel).fixed; state.result.key = inputsKey(); break; }
    case 'copyMsg': {
      const p = findP(b.dataset.id), A = state.result.A, a = A[p.id];
      const text = `Hei ${p.name.split(' ')[0]}! Kesälomasi ${state.year}: ${a.s ? datesOf(p, a.s) : 'sovitaan erikseen'}. ${messageFor(occFrom(A), p, A)}`;
      try { await navigator.clipboard.writeText(text); }
      catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      toast('Viesti kopioitu'); return;
    }
    case 'reroll': state.seed = randSeed(); // jatkuu laskentaan
    case 'run': {
      b.disabled = true; b.innerHTML = I('clock') + ' Lasketaan…'; await tick();
      const best = solve(state.seed);
      state.result = {A:best.A, order:best.order, seed:state.seed, key:inputsKey(), at:new Date().toLocaleString('fi-FI')};
      if (currentTab !== 'result'){ save(); showTab('result'); toast('Lomajako laskettu'); return; }
      toast('Lomajako laskettu');
      break;
    }
    case 'csv': {
      const A = state.result.A, c = occFrom(A);
      const lines = ['Nimi;Rooli;Lomajaksot;Tulos;Perustelu'];
      for (const p of state.people){ const a = A[p.id]; if (!a) continue;
        const jaksot = a.s ? datesOf(p, a.s) : '';
        lines.push([p.name, roleName(p.role), jaksot, LEVEL_LABEL[a.lv], explain(c, p, A)].map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')); }
      download(`lomajako-${state.year}.csv`, '﻿' + lines.join('\r\n'), 'text/csv'); return;
    }
    case 'saveHist': {
      if (state.history.some(h => h.year === state.year) && !(await ask(`Vuodelle ${state.year} on jo tallennettu jako. Korvataanko?`, 'Korvaa'))) return;
      const A = state.result.A;
      state.history = state.history.filter(h => h.year !== state.year);
      state.history.push({year:state.year, rows:state.people.filter(p => A[p.id]).map(p => ({name:p.name, level:A[p.id].lv}))});
      toast(`Jako ${state.year} tallennettu historiaan`); break;
    }
    case 'delHist': if (!(await ask(`Poistetaanko vuoden ${b.dataset.year} historia? Se vaikuttaa etusijoihin.`, 'Poista', true))) return; state.history = state.history.filter(h => h.year !== +b.dataset.year); break;
  }
  save(); render();
});

let startTab = 'settings';
try { startTab = localStorage.getItem(TAB_KEY) || 'settings'; } catch {}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
$('#saveStatus').innerHTML = I('shield') + ' Tiedot vain tällä koneella';
showTab(state.people.length ? startTab : 'settings');
</script>
</body>
